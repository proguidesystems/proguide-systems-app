<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
let CHART_KAM_ESTADOS = null;
let CHART_KAM_SKUS = null;
let CHART_KAM_TENDENCIA = null;

function renderModuloDashboardKAM() {
    const container = document.getElementById("modulosContainer");
    container.innerHTML = `
        <div class="flex flex-col gap-6">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-xl font-black text-slate-900 dark:text-white flex items-center gap-2">
                        <i data-lucide="monitor-dot" class="w-6 h-6 text-sky-500 dark:text-pgs-cyan"></i> Dashboard Comercial
                    </h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 font-medium">Métricas de cumplimiento y estado de pedidos.</p>
                </div>
                <button onclick="cargarDashboardKAM()" class="bg-slate-900 hover:bg-slate-800 dark:bg-gradient-to-r dark:from-pgs-cyan dark:to-pgs-neon text-white dark:text-slate-950 font-black px-4 py-2 rounded-xl text-xs flex items-center gap-2 shadow-md transition cursor-pointer">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Actualizar
                </button>
            </div>

            <!-- FILTROS -->
            <div class="glass-panel p-4 flex gap-3 items-center flex-wrap">
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-slate-700 dark:text-slate-300">Desde:</label>
                    <input type="date" id="kamFiltroFechaInicio" class="rounded-lg px-2.5 py-1.5 text-xs font-semibold focus:outline-none">
                </div>
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-slate-700 dark:text-slate-300">Hasta:</label>
                    <input type="date" id="kamFiltroFechaFin" class="rounded-lg px-2.5 py-1.5 text-xs font-semibold focus:outline-none">
                </div>
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-slate-700 dark:text-slate-300">Estado:</label>
                    <select id="kamFiltroEstado" class="rounded-lg px-2.5 py-1.5 text-xs font-semibold focus:outline-none">
                        <option value="">Todos</option>
                        <option value="Pendiente">Pendiente</option>
                        <option value="Aprobado">Aprobado</option>
                        <option value="En producción">En producción</option>
                        <option value="Despachado">Despachado</option>
                        <option value="Cancelado">Cancelado</option>
                    </select>
                </div>
                <button onclick="cargarDashboardKAM()" class="bg-sky-600 hover:bg-sky-700 text-white font-bold px-4 py-1.5 rounded-lg text-xs transition cursor-pointer">Aplicar Filtros</button>
            </div>

            <div id="dashboardKAMData">
                <div class="text-center py-20">
                    <div class="inline-block w-8 h-8 border-4 border-sky-600 dark:border-pgs-cyan border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-3 font-bold">Analizando pedidos...</p>
                </div>
            </div>
        </div>
    `;
    lucide.createIcons();
    cargarDashboardKAM();
}

function cargarDashboardKAM() {
    if (typeof google === "undefined" || !google.script) return;
    const filtros = {
        fechaInicio: document.getElementById("kamFiltroFechaInicio")?.value || "",
        fechaFin: document.getElementById("kamFiltroFechaFin")?.value || "",
        estado: document.getElementById("kamFiltroEstado")?.value || ""
    };
    
    document.getElementById("dashboardKAMData").innerHTML = `
        <div class="text-center py-10"><div class="inline-block w-8 h-8 border-4 border-sky-600 dark:border-pgs-cyan border-t-transparent rounded-full animate-spin"></div><p class="text-xs mt-2 text-slate-500 font-bold">Filtrando datos...</p></div>
    `;

    google.script.run
        .withSuccessHandler(res => {
            if (!res.ok) return mostrarAlerta(res.error, true);
            renderMetricasKAM(res);
        })
        .withFailureHandler(err => {
            document.getElementById("dashboardKAMData").innerHTML = `<div class="p-6 bg-rose-500/10 border border-rose-500/30 rounded-2xl text-rose-600 dark:text-rose-400 text-sm font-bold text-center">Error: ${err.message}</div>`;
        })
        .obtenerDatosDashboardKAM(SESION.cedula, filtros);
}

function renderMetricasKAM(res) {
    const container = document.getElementById("dashboardKAMData");
    const data = res.datos || [];
    const kpis = res.kpis || { total: 0, pendientes: 0, enPlanta: 0, listos: 0 };
    const charts = res.charts || { estados: {}, topSkus: [], tendencia: [] };

    container.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="glass-panel p-5">
                <div class="flex items-center gap-3 mb-2">
                    <div class="p-2 bg-sky-100 dark:bg-sky-500/20 text-sky-600 dark:text-pgs-cyan rounded-lg"><i data-lucide="clipboard-list" class="w-5 h-5"></i></div>
                    <p class="text-xs font-black uppercase text-slate-500 dark:text-slate-400">Total Pedidos</p>
                </div>
                <p class="text-3xl font-black text-slate-800 dark:text-white">${kpis.total}</p>
            </div>
            <div class="glass-panel p-5">
                <div class="flex items-center gap-3 mb-2">
                    <div class="p-2 bg-amber-100 dark:bg-amber-500/20 text-amber-600 dark:text-amber-400 rounded-lg"><i data-lucide="clock" class="w-5 h-5"></i></div>
                    <p class="text-xs font-black uppercase text-slate-500 dark:text-slate-400">Pendientes</p>
                </div>
                <p class="text-3xl font-black text-slate-800 dark:text-white">${kpis.pendientes}</p>
            </div>
            <div class="glass-panel p-5">
                <div class="flex items-center gap-3 mb-2">
                    <div class="p-2 bg-orange-100 dark:bg-orange-500/20 text-orange-600 dark:text-orange-400 rounded-lg"><i data-lucide="factory" class="w-5 h-5"></i></div>
                    <p class="text-xs font-black uppercase text-slate-500 dark:text-slate-400">En Planta</p>
                </div>
                <p class="text-3xl font-black text-slate-800 dark:text-white">${kpis.enPlanta}</p>
            </div>
            <div class="glass-panel p-5">
                <div class="flex items-center gap-3 mb-2">
                    <div class="p-2 bg-emerald-100 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 rounded-lg"><i data-lucide="check-circle" class="w-5 h-5"></i></div>
                    <p class="text-xs font-black uppercase text-slate-500 dark:text-slate-400">Listos / Despachados</p>
                </div>
                <p class="text-3xl font-black text-slate-800 dark:text-white">${kpis.listos}</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
            <div class="glass-panel p-5">
                <h3 class="text-xs font-bold text-slate-700 dark:text-slate-300 mb-3">Estados de Pedidos</h3>
                <div class="relative h-[220px] w-full"><canvas id="chartKAMEstados"></canvas></div>
            </div>
            <div class="glass-panel p-5">
                <h3 class="text-xs font-bold text-slate-700 dark:text-slate-300 mb-3">Top 5 SKUs Solicitados</h3>
                <div class="relative h-[220px] w-full"><canvas id="chartKAMSkus"></canvas></div>
            </div>
            <div class="glass-panel p-5">
                <h3 class="text-xs font-bold text-slate-700 dark:text-slate-300 mb-3">Tendencia de Entregas</h3>
                <div class="relative h-[220px] w-full"><canvas id="chartKAMTendencia"></canvas></div>
            </div>
        </div>

        <div class="glass-panel overflow-hidden">
            <div class="p-4 border-b border-slate-300 dark:border-pgs-border flex justify-between items-center">
                <h3 class="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2">
                    <i data-lucide="list" class="w-4 h-4 text-sky-500 dark:text-pgs-cyan"></i> Seguimiento de Pedidos
                </h3>
            </div>
            <div class="overflow-y-auto max-h-[400px]">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-200/50 dark:bg-slate-900/60 sticky top-0 backdrop-blur-md text-[10px] font-black uppercase text-slate-700 dark:text-slate-300">
                        <tr>
                            <th class="p-3">Pedido</th>
                            <th class="p-3">SKU</th>
                            <th class="p-3">Destinatario</th>
                            <th class="p-3">Fecha Req.</th>
                            <th class="p-3">Estado Producción</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200 dark:divide-pgs-border/40">
                        ${data.length === 0 ? '<tr><td colspan="5" class="p-6 text-center text-slate-500 font-bold">No hay pedidos registrados con estos filtros</td></tr>' : 
                            data.map(d => `
                            <tr class="hover:bg-slate-100 dark:hover:bg-slate-800/40 transition">
                                <td class="p-3 font-mono font-bold text-sky-700 dark:text-pgs-cyan">${d.pedido}</td>
                                <td class="p-3">
                                    <div class="font-mono font-bold text-slate-800 dark:text-slate-100">${d.sku}</div>
                                    <div class="text-[10px] text-slate-500 dark:text-slate-400 truncate max-w-[150px]">${d.descripcion_sku}</div>
                                </td>
                                <td class="p-3 text-slate-700 dark:text-slate-300 font-medium">${d.destinatario}</td>
                                <td class="p-3 font-mono font-bold text-slate-700 dark:text-slate-300">${d.fecha_preferida_entrega}</td>
                                <td class="p-3">
                                    ${badgeEstadoProduccionKAM(d.estado_produccion)}
                                    ${d.ultimo_proceso ? `<div class="text-[10px] text-sky-600 dark:text-pgs-cyan font-bold mt-1">Paso: ${d.ultimo_proceso}</div>` : ''}
                                    ${d.alerta_no_conforme ? `<div class="text-[9px] text-rose-600 dark:text-rose-400 font-bold mt-1 flex items-center gap-1" title="${d.alerta_no_conforme}"><i data-lucide="alert-triangle" class="w-3 h-3"></i> Alerta No Conforme</div>` : ''}
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        </div>
    `;
    lucide.createIcons();

    // Renderizar Gráficas
    setTimeout(() => {
        if (CHART_KAM_ESTADOS) CHART_KAM_ESTADOS.destroy();
        const ctxEstados = document.getElementById('chartKAMEstados');
        if (ctxEstados) {
            CHART_KAM_ESTADOS = new Chart(ctxEstados, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(charts.estados),
                    datasets: [{ data: Object.values(charts.estados), backgroundColor: ['#f59e0b', '#00D2FF', '#f97316', '#8b5cf6', '#10b981', '#ef4444'], borderWidth: 0 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#94a3b8' } } } }
            });
        }

        if (CHART_KAM_SKUS) CHART_KAM_SKUS.destroy();
        const ctxSkus = document.getElementById('chartKAMSkus');
        if (ctxSkus) {
            CHART_KAM_SKUS = new Chart(ctxSkus, {
                type: 'bar',
                data: {
                    labels: charts.topSkus.map(s => s.sku),
                    datasets: [{ label: 'Cant. Solicitada', data: charts.topSkus.map(s => s.cantidad), backgroundColor: '#00D2FF', borderRadius: 6 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } }, x: { ticks: { color: '#94a3b8' } } } }
            });
        }

        if (CHART_KAM_TENDENCIA) CHART_KAM_TENDENCIA.destroy();
        const ctxTendencia = document.getElementById('chartKAMTendencia');
        if (ctxTendencia) {
            CHART_KAM_TENDENCIA = new Chart(ctxTendencia, {
                type: 'line',
                data: {
                    labels: charts.tendencia.map(t => t.fecha),
                    datasets: [{ label: 'Pedidos', data: charts.tendencia.map(t => t.cantidad), borderColor: '#10b981', backgroundColor: 'rgba(16, 185, 129, 0.2)', fill: true, tension: 0.4 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { stepSize: 1, color: '#94a3b8' } }, x: { ticks: { color: '#94a3b8' } } } }
            });
        }
    }, 100);
}

function badgeEstadoProduccionKAM(estado) {
    const colores = {
        "Sin programar":     "bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300",
        "Programado":        "bg-sky-100 dark:bg-sky-500/10 text-sky-800 dark:text-pgs-cyan",
        "En producción":     "bg-orange-100 dark:bg-orange-500/10 text-orange-800 dark:text-orange-400",
        "Listo":             "bg-emerald-100 dark:bg-emerald-500/10 text-emerald-800 dark:text-emerald-400",
        "Despachado":        "bg-cyan-100 dark:bg-cyan-500/10 text-cyan-800 dark:text-cyan-400"
    };
    const clase = colores[estado] || colores["Sin programar"];
    return `<span class="px-2 py-1 rounded text-[10px] font-black ${clase}">${estado || '-'}</span>`;
}
</script>
